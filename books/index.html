<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My Books — a reading log for members.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>My Books · Learn With Luke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/game.css">
  <link rel="stylesheet" href="css/books.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main-content" class="game-page">
    <header class="game-header">
      <h1>📚 My Books</h1>
      <p class="game-instructions" role="note" id="books-hello">Checking who you are…</p>
    </header>

    <section class="game-panel" id="books-gate" hidden>
      <p class="club-lead" id="books-gate-why"></p>
      <div class="game-actions">
        <a class="btn btn-primary" href="../signin/index.html">Sign in</a>
      </div>
    </section>

    <div id="books-body" hidden>
      <section class="game-panel" aria-labelledby="add-title">
        <h2 id="add-title">Add a book</h2>
        <form class="admin-form books-form" id="book-form">
          <input type="hidden" id="book-id">
          <label for="book-title">Title</label>
          <input type="text" id="book-title" required>
          <label for="book-author">Who wrote it</label>
          <input type="text" id="book-author">
          <label for="book-status">How is it going</label>
          <select id="book-status">
            <option value="want">Want to read</option>
            <option value="reading" selected>Reading now</option>
            <option value="finished">Finished</option>
            <option value="stopped">Gave up on it</option>
          </select>
          <label for="book-rating">Stars <span class="admin-hint">(only if you finished it)</span></label>
          <select id="book-rating">
            <option value="">No stars yet</option>
            <option value="5">★★★★★</option>
            <option value="4">★★★★</option>
            <option value="3">★★★</option>
            <option value="2">★★</option>
            <option value="1">★</option>
          </select>
          <label for="book-notes">What did you think</label>
          <textarea id="book-notes" rows="3" placeholder="The best bit, the worst bit, who you would tell about it."></textarea>
          <label class="admin-check">
            <input type="checkbox" id="book-shared">
            <span>Let other members of the book club see this one. Left unticked,
            only you and your grown-up can.</span>
          </label>
          <div class="game-actions">
            <button type="submit" class="btn btn-primary">Save book</button>
            <button type="button" class="btn btn-secondary" id="book-clear">Clear</button>
          </div>
        </form>
        <p class="admin-message" id="books-message" role="status" aria-live="polite"></p>
      </section>

      <section class="game-panel" aria-labelledby="shelf-title">
        <h2 id="shelf-title">My shelf</h2>
        <div class="chips" id="book-filters" role="group" aria-label="Which books to show"></div>
        <div class="book-stats" id="book-stats"></div>
        <div class="book-list" id="book-list"></div>
      </section>

      <section class="game-panel" id="others-panel" aria-labelledby="others-title" hidden>
        <h2 id="others-title">What everyone else is reading</h2>
        <p class="club-lead">Only the books people chose to share.</p>
        <div class="book-list" id="others-list"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="../js/nav.js"></script>
  <script src="../vendor/supabase.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="js/books.js"></script>
</body>
</html>
