<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage — everything you are allowed to change, in one place.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Manage · Learn With Luke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/game.css">
  <link rel="stylesheet" href="css/manage.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main-content" class="game-page game-page--wide">
    <div class="account-bar" id="account-bar" hidden></div>

    <section class="game-panel" id="manage-locked" hidden>
      <p class="club-lead" id="manage-locked-why"></p>
      <div class="game-actions">
        <a class="btn btn-primary" href="../signin/index.html">Sign in</a>
      </div>
    </section>

    <!-- The console: what you may change on the left, the work on the right.
         Sections are drawn by capability, so nothing here leads to a refusal. -->
    <div class="console" id="console" hidden>
      <aside class="console-nav" id="console-nav" aria-label="What to manage"></aside>

      <section class="console-main">
        <header class="console-head">
          <div>
            <h1 class="console-title" id="section-title">Manage</h1>
            <p class="console-blurb" id="section-blurb"></p>
          </div>
          <div class="console-tools">
            <input type="search" class="console-search" id="section-search"
                   placeholder="Find…" aria-label="Search this list" hidden>
            <button type="button" class="btn btn-primary console-add" id="section-add" hidden>＋ Add</button>
          </div>
        </header>

        <!-- The form lives in a drawer that opens when asked for and gets out
             of the way when it is not. A permanent form above every list makes
             a console read like paperwork. -->
        <div class="console-drawer" id="drawer" hidden>
          <form class="admin-form" id="drawer-form"></form>
        </div>

        <div class="console-list" id="section-list"></div>
      </section>
    </div>

    <p class="admin-message" id="manage-message" role="status" aria-live="polite"></p>
  </main>

  <div id="site-footer"></div>
  <script src="../js/nav.js"></script>
  <script src="../vendor/supabase.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/account-bar.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
