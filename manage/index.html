<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage — everything you are allowed to change, in one place.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Manage · Learn With Luke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/game.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main-content" class="game-page">
    <div class="account-bar" id="account-bar" hidden></div>

    <header class="game-header">
      <h1>⚙️ Manage</h1>
      <p class="game-instructions" role="note" id="manage-intro">Checking what you can do…</p>
    </header>

    <section class="game-panel" id="manage-locked" hidden>
      <p class="club-lead" id="manage-locked-why"></p>
      <div class="game-actions">
        <a class="btn btn-primary" href="../signin/index.html">Sign in</a>
      </div>
    </section>

    <div id="manage-body" hidden>
      <!-- One strip of areas. Only the ones this person may actually use are
           drawn, so nothing here leads to a refusal. -->
      <div class="manage-areas" id="manage-areas" role="tablist" aria-label="What to manage"></div>

      <div id="manage-panels"></div>
    </div>

    <p class="admin-message" id="manage-message" role="status" aria-live="polite"></p>
  </main>

  <div id="site-footer"></div>
  <script src="../js/nav.js"></script>
  <script src="../vendor/supabase.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/account-bar.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
